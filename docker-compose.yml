# Self-hosted deployment of the static site, reached through a Cloudflare Tunnel.
#
#   cp .env.example .env      # then set TUNNEL_TOKEN
#   docker compose up -d
#
# No host ports are published. That is the point: this can run on a machine that
# is already using 443 for Outline without touching it. cloudflared makes an
# outbound connection to Cloudflare, so nothing has to be opened in the firewall
# and the machine's real IP is never exposed through this site.
#
# Production runs on Cloudflare Pages instead; this is for serving the same
# files from a server we control.
services:
  web:
    image: caddy:2-alpine
    container_name: zeethee-web
    restart: unless-stopped
    env_file:
      - .env
    # expose, not ports: reachable from cloudflared on the compose network only,
    # never from the host or the internet directly.
    expose:
      - "80"
    volumes:
      # The site itself is read-only to the server that publishes it.
      - ./:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: zeethee-tunnel
    restart: unless-stopped
    env_file:
      - .env
    # The token carries the tunnel's identity and credentials; cloudflared reads
    # it from TUNNEL_TOKEN. Route the tunnel's public hostname to http://web:80
    # in the Cloudflare dashboard.
    command: tunnel --no-autoupdate run
    depends_on:
      - web
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

volumes:
  caddy-data:
  caddy-config:
